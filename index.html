['K8','Persepsi transparansi (pendukung)',null,0,p=>LK('K8',p,[0,1,2,3,4,5,8,9])],['Q3','Kualitas tindak lanjut supervisi',null,0,p=>RB('Q3',p)],['Q4','Keterlibatan siswa saat pembiasaan',null,0,p=>RB('Q4',p)]];
function nav(a){const g=(t,ks)=>`<h3>${t}</h3>`+ks.map(k=>`<a href="#${k}" title="${S[k].t}"${k==a?' class="on"':''}>${k}<span>${S[k].t}</span><em>${(D[k]||[]).length||''}</em></a>`).join(''),K=Object.keys(S);
$('#nv').innerHTML=`<h1>Instrumen Outcome SIMARA</h1><small>SD Negeri 1 Raja</small><a class="pl${a=='dash'?' on':''}" href="#dash">Dasbor</a><a class="pl${a=='admin'?' on':''}" href="#admin">Admin</a>`+g('Kuantitatif',K.filter(k=>k[0]=='K'))+g('Kualitatif',K.filter(k=>k[0]=='Q'))}
const inp=(c,v,ro)=>'pkg'.includes(c[1])?`<select>${opts(LST[c[1]](),v)}</select>`:c[1]=='y'?'<select><option value="">–</option><option>Ya</option><option>Tidak</option></select>':`<input type="${c[1]=='n'?'number':c[1]=='d'?'date':'text'}"${c[1]=='n'?' min="0"':''} value="${E(v||'')}"${ro?' readonly':''}>`;
const rowH=(s,i)=>{const P=pr(s);return `<tr>${s.c.map((c,j)=>`<td>${inp(c,P&&i>=0?(j==0?P[i]:j==s.dj?C.kelas[i].jml:''):'',P&&i>=0&&j==0&&c[1]=='t')}</td>`).join('')}<td><button type="button" class="x" aria-label="Hapus baris">×</button></td></tr>`};
function form(id){const s=S[id],res=IND.filter(i=>i[0]==id&&i[2]!=null).map(i=>`Hasil sementara ${i[1]}: baseline ${pct(i[4]('Baseline'))??'–'}%, endline ${pct(i[4]('Endline'))??'–'}% (target ${i[3]?'>':'≥'}${i[2]}%)`).join('. ');
let x=`<h2>${id}. ${s.t}</h2><p class="mu">${s.d}</p>${res?`<p class="res">${res}</p>`:''}<form id="f">${hint(s)}<p class="mu">Tahun ajaran: ${ta()?E(ta().nama):'belum diatur'}</p><div class="hd"><label>Tahap<select name="ph"><option>Baseline<option>Endline</select></label><label>Periode${months().length?`<select name="per">${opts(months().concat(['Semester Ganjil','Semester Genap']))}</select>`:'<input name="per" placeholder="mis. Oktober 2026">'}</label>${s.G?`<label>Nama guru<select name="who">${opts(LST.g())}</select></label>`:'<label>Pengisi/kode<input name="who"></label>'}${s.K?`<label>Kelas<select name="kls">${opts(LST.k())}</select></label>`:''}</div>`;
if(s.c)x+=`<div class="sc"><table class="rt"><thead><tr>${s.c.map(c=>`<th>${c[0]}</th>`).join('')}<th></th></tr></thead><tbody>${Array.from({length:pr(s)?pr(s).length:s.n},(_,i)=>rowH(s,i)).join('')}</tbody></table></div><button type="button" id="ad">Tambah baris</button>`;
if(s.L)x+=`<p class="mu">Skala: 1 Sangat tidak setuju, 2 Tidak setuju, 3 Cukup setuju, 4 Setuju, 5 Sangat setuju.</p><div class="sc"><table><tbody>${s.L.map((t,i)=>`<tr><td>${i+1}</td><td>${t}</td>${[1,2,3,4,5].map(v=>`<td><label class="rb"><input type="radio" name="l${i}" value="${v}">${v}</label></td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
if(s.R)x+=`<div class="sc"><table><tbody>${s.R.i.map((t,i)=>`<tr><td>${i+1}</td><td>${t}</td><td><select class="rs"><option value="">–</option>${s.R.o.map((o,k)=>`<option value="${k}">${k} ${o}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`;
(s.q||[]).forEach(q=>x+=`<label class="q">${q}<textarea rows="3"></textarea></label>`);
if(id[0]=='Q')x+=`<label class="q">Tema (pisahkan dengan koma)<input id="tm" placeholder="mis. konsistensi, beban kerja"></label>`;
const ls=(D[id]||[]).map(r=>`<tr><td>${E(r.ph)}</td><td>${E(r.per||'-')}</td><td>${E((r.who||'-')+(r.kls?' / '+r.kls:''))}</td><td>${new Date(r.ts).toLocaleDateString('id-ID')}</td><td><button class="sm" data-d="${r.id}">Hapus</button></td></tr>`).join('');
return x+`<p><button class="p">Simpan isian</button></p></form><h3>Data tersimpan</h3>${ls?`<div class="sc"><table><thead><tr><th>Tahap</th><th>Periode</th><th>Pengisi</th><th>Tanggal</th><th></th></tr></thead><tbody>${ls}</tbody></table></div>`:'<p class="mu">Belum ada data. Isi formulir di atas lalu simpan.</p>'}`}
function sub(e){e.preventDefault();const f=e.target,id=location.hash.slice(1),s=S[id],r={id:Date.now().toString(36),ph:f.ph.value,per:f.per.value,who:f.who.value,kls:f.kls?f.kls.value:'',ta:(ta()||{}).id||'',ts:Date.now(),rows:[],lik:[],rub:[],q:[],tema:''};
if(s.c)r.rows=[...f.querySelectorAll('.rt tbody tr')].map(t=>[...t.querySelectorAll('input,select')].map(i=>i.value)).filter(a=>a.some((v,j)=>v&&!(pr(s)&&(j==0||j==s.dj))));
if(s.L)r.lik=s.L.map((_,i)=>+(f.querySelector(`input[name=l${i}]:checked`)||{}).value||0);
if(s.R)r.rub=[...f.querySelectorAll('.rs')].map(i=>i.value);
r.q=[...f.querySelectorAll('.q textarea')].map(t=>t.value);const tm=f.querySelector('#tm');if(tm)r.tema=tm.value;
if(!(r.rows.length||r.lik.some(v=>v)||r.rub.some(v=>v!=='')||r.q.some(v=>v.trim())))return toast('Isi minimal satu bagian sebelum menyimpan.');
(D[id]=D[id]||[]).push(r);save();push({op:'put',k:id,r});toast('Tersimpan');go()}
function dash(){const V=IND.map(i=>{const b=i[4]('Baseline'),e=i[4]('Endline'),pb=pct(b),pe=pct(e);return{i,b,e,pb,pe,ok:pe==null||i[2]==null?null:(i[3]?pe>i[2]:pe>=i[2])}}),w=v=>v==null?0:Math.min(100,v),T0=V.filter(v=>v.i[2]!=null);
const bars=V.map(v=>`<div class="ir"><div><b>${v.i[0]}</b> ${v.i[1]}<small>${v.i[2]!=null?'Target '+(v.i[3]?'>':'≥')+v.i[2]+'%':'Data pendukung, tanpa target'}</small></div><div class="tk"><i class="bb" style="width:${w(v.pb)}%"></i><i class="eb" style="width:${w(v.pe)}%"></i>${v.i[2]!=null?`<u style="left:${v.i[2]}%"></u>`:''}</div><div>${v.pb??'–'}% → ${v.pe??'–'}%<small>jumlah data ${v.b.d} → ${v.e.d}</small></div><span class="ch ${v.ok==null?'na':v.ok?'ok':'no'}">${v.ok==null?(v.pe==null?'Belum ada endline':'Pendukung'):v.ok?'Tercapai':'Belum tercapai'}</span></div>`).join('');
const dist=['K3','K7','K8'].map(k=>{const c=[0,0,0,0,0];(D[k]||[]).forEach(r=>r.lik.forEach(v=>v&&c[v-1]++));const t=c.reduce((a,b)=>a+b,0);return `<div class="ir" style="grid-template-columns:minmax(150px,230px) minmax(120px,1fr) 100px"><div><b>${k}</b> ${S[k].t}</div><div class="tk st">${c.map((n,j)=>`<i style="width:${t?n/t*100:0}%;background:${CL[j]}" title="Skor ${j+1}: ${n}"></i>`).join('')}</div><div>${t} jawaban</div></div>`}).join('');
const TM={};Object.values(D).flat().forEach(r=>(r.tema||'').split(',').forEach(t=>{t=t.trim().toLowerCase();if(t)TM[t]=(TM[t]||0)+1}));const tm=Object.entries(TM).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=tm.length?tm[0][1]:1;
const K=Object.keys(S),mc=Math.max(1,...K.map(k=>(D[k]||[]).length)),demo=Object.values(D).flat().some(r=>r.demo);
return `<h2>Dasbor Capaian</h2><p class="mu">Membandingkan baseline dan endline dengan target. Angka menunjukkan capaian terhadap target, bukan bukti sebab-akibat; lihat jumlah data pada setiap indikator.</p>${demo?'<p class="res">Data contoh sedang aktif. Hapus sebelum memakai data sebenarnya.</p>':''}
<p><button id="dm" class="p">Muat data contoh</button> <button id="cl">Hapus data contoh</button></p>
<div class="sum"><span class="ch ok">${T0.filter(v=>v.ok===true).length} tercapai</span><span class="ch no">${T0.filter(v=>v.ok===false).length} belum tercapai</span><span class="ch na">${T0.filter(v=>v.ok===null).length} belum ada endline</span></div>
<div class="card"><h3>Capaian indikator</h3><p class="mu"><i class="lg" style="background:var(--bs)"></i>Baseline<i class="lg" style="background:var(--tl)"></i>Endline<i class="lg" style="background:var(--ink);width:3px"></i>Target</p>${bars}</div>
<div class="card"><h3>Sebaran jawaban angket</h3><p class="mu">Warna dari skor 1 (merah) sampai 5 (hijau kebiruan). Arahkan kursor untuk melihat jumlah.</p>${dist}</div>
<div class="card"><h3>Tema kualitatif yang sering muncul</h3>${tm.length?tm.map(t=>`<div class="ir" style="grid-template-columns:minmax(150px,230px) minmax(120px,1fr) 60px"><div>${E(t[0])}</div><div class="tk"><i class="eb" style="width:${t[1]/mx*100}%;top:0;height:24px"></i></div><div>${t[1]}×</div></div>`).join(''):'<p class="mu">Belum ada tema. Isi kolom tema pada instrumen kualitatif.</p>'}</div>
<div class="card"><h3>Jumlah isian per instrumen</h3><div class="cbs">${K.map(k=>{const n=(D[k]||[]).length;return `<div class="cb"><div class="cw"><i style="height:${n/mc*100}%"></i></div><b>${n}</b><br>${k}</div>`}).join('')}</div></div>
<details><summary>Cadangkan atau pulihkan data</summary><p class="mu">Data tersimpan di peramban perangkat ini. Salin teks cadangan ke berkas Anda, atau tempel teks cadangan untuk memulihkan.</p><textarea id="bk" rows="4"></textarea><p><button id="cp">Tampilkan cadangan</button> <button id="rs" class="p">Pulihkan dari teks</button></p></details>`}
function demo(){const TM=['konsistensi','beban kerja','kendala jaringan','keterlibatan siswa','apresiasi','efisiensi'],R=Math.random;
Object.keys(S).forEach(id=>{const s=S[id];D[id]=(D[id]||[]).filter(r=>!r.demo);['Baseline','Endline'].forEach((ph,k)=>{const f=(s.f||[.65,.95])[k];
for(let m=0;m<(s.L?8:1);m++){const r={id:'d'+id+k+m,demo:1,ph,per:k?'Akhir semester':'Awal semester',who:'Data contoh',ts:Date.now(),rows:[],lik:[],rub:[],q:[],tema:''};
if(s.c)for(let i=0,P=pr(s);i<(P?P.length:s.n);i++){const b=20+Math.round(R()*30);let j=0;r.rows.push(s.c.map((c,ci)=>c[1]=='y'?(R()<f?'Ya':'Tidak'):c[1]=='n'?String(j++?Math.round(b*f):b):c[1]=='d'?'2026-09-0'+(1+i%9):'pkg'.includes(c[1])?(LST[c[1]]()[i]||''):ci==0?(P?P[i]:c[0]+' '+(i+1)):''))}
if(s.L)r.lik=s.L.map(()=>Math.min(5,Math.max(1,Math.round((k?4.4:3.4)+(R()-.5)*1.8))));
if(s.R)r.rub=s.R.i.map(()=>String(k?(R()<.7?2:1):(R()<.5?1:R()<.5?0:2)));
r.q=(s.q||[]).map(()=>'Contoh jawaban.');if(id[0]=='Q')r.tema=TM.filter(()=>R()<.4).join(', ');D[id].push(r)}})});save();push({op:'all',D,C});go()}
let EDT={},PD='';
function ent(k){const e=EN[k],ed=EDT.k==k?C[k].find(x=>x.id==EDT.id):null;
return `<div class="card"><h3>${e.t}</h3><form data-e="${k}" class="ef">${e.f.map(f=>`<label>${f[1]}<input name="${f[0]}" type="${f[2]}" placeholder="${f[3]}" value="${E(ed?ed[f[0]]:f[2]=='month'?f[3]:'')}" required></label>`).join('')}<button class="p">${ed?'Simpan perubahan':'Tambah'}</button>${ed?'<button type="button" data-cancel="1">Batal</button>':''}</form>
<div class="sc"><table><thead><tr>${k=='ta'?'<th>Aktif</th>':''}${e.f.map(f=>`<th>${f[1]}</th>`).join('')}<th></th></tr></thead><tbody>${C[k].map(x=>`<tr>${k=='ta'?`<td><input type="radio" name="act" data-act="${x.id}" aria-label="Jadikan aktif"${(ta()||{}).id==x.id?' checked':''}></td>`:''}${e.f.map(f=>`<td>${E(x[f[0]])}</td>`).join('')}<td><button class="sm" data-ed="${k}:${x.id}">Edit</button> <button class="sm" data-dl="${k}:${x.id}">${PD==k+x.id?'Yakin hapus?':'Hapus'}</button></td></tr>`).join('')||'<tr><td colspan="9" class="mu">Belum ada data.</td></tr>'}</tbody></table></div>${k=='kelas'?`<p class="mu">Total siswa: ${C.kelas.reduce((a,x)=>a+nm(x.jml),0)}</p>`:''}${k=='ta'&&ta()?`<p class="mu">Bulan dalam pilihan periode: ${months().join(', ')}. Dasbor menampilkan data tahun ajaran yang aktif.</p>`:''}</div>`}
const admin=()=>`<h2>Admin</h2><p class="mu">Data di sini otomatis dipakai di formulir: program Saru Prabu (K1, K2), nama guru (angket dan instrumen guru), bulan dari tahun ajaran aktif (semua isian periode), dan kelas beserta jumlah siswa (K2, K5, K8, K12, Q4). Mengubah atau menghapus data di sini tidak mengubah isian yang sudah tersimpan.</p>`+Object.keys(EN).map(ent).join('');
function adm(e){const d=e.target.dataset;if(d.act!==undefined){C.act=d.act;saveC();return go()}
if(d.cancel){EDT={};return go()}
if(d.ed){const[k,i]=d.ed.split(':');EDT={k,id:i};return go()}
if(d.dl){const[k,i]=d.dl.split(':');if(PD!=k+i){PD=k+i;return go()}C[k]=C[k].filter(x=>x.id!=i);if(k=='ta'&&C.act==i)C.act=C.ta.length?C.ta[0].id:'';PD='';saveC();go()}}
function go(){const id=(location.hash||'#dash').slice(1),a=id=='admin'||S[id]?id:'dash';$('#m').innerHTML=a=='dash'?dash():a=='admin'?admin():form(a);nav(a);const f=$('#f');if(f)f.onsubmit=sub;const ad=$('#ad');if(ad)ad.onclick=()=>$('.rt tbody').insertAdjacentHTML('beforeend',rowH(S[a],-1))}
$('#m').onclick=e=>{const t=e.target,id=location.hash.slice(1);if(t.classList.contains('x'))t.closest('tr').remove();
if(t.dataset.d){D[id]=D[id].filter(r=>r.id!=t.dataset.d);save();push({op:'del',i:t.dataset.d});go()}
if(t.id=='dm')demo();
if(t.id=='cl'){Object.keys(D).forEach(k=>D[k]=D[k].filter(r=>!r.demo));save();push({op:'all',D,C});go()}
if(t.id=='cp'){$('#bk').value=JSON.stringify({D,C});$('#bk').select()}
if(t.id=='rs'){try{const o=JSON.parse($('#bk').value);if(!o||typeof o!='object'||Array.isArray(o))throw 0;if(o.D){D=o.D;C=Object.assign(C,o.C||{})}else D=o;save();saveC();push({op:'all',D,C});go();toast('Data dipulihkan')}catch(x){toast('Teks cadangan tidak valid.')}}};
$('#m').addEventListener('click',adm);
$('#m').addEventListener('submit',e=>{const k=e.target.dataset.e;if(!k)return;e.preventDefault();const fd=new FormData(e.target),o={};EN[k].f.forEach(f=>o[f[0]]=f[2]=='number'?nm(fd.get(f[0])):fd.get(f[0]).trim());if(EDT.k==k){Object.assign(C[k].find(x=>x.id==EDT.id),o);EDT={}}else{o.id=Date.now().toString(36);C[k].push(o);if(k=='ta'&&!C.act)C.act=o.id}saveC();go()});
addEventListener('hashchange',go);go();pull(1);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(location.hash||'#dash')=='#dash')pull(1)});
</script></body></html>
